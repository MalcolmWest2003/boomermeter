# Development aid: on pushes to work branches, run the tests and print what
# candidate data sources return (python -m bm.probe). Stores and publishes
# nothing; the output is read from the job log.
name: probe

on:
  push:
    branches: ["claude/**"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt openpyxl xlrd
      - run: python -m pytest -q
      - run: python -m bm.probe
        if: ${{ !env.PROBE_ARGS }}
      - run: python -m bm.probe $PROBE_ARGS
        if: ${{ env.PROBE_ARGS }}
    env:
      # Set to probe specific sources in full instead of the whole candidate list.
      PROBE_ARGS: >-
        A4002E1A156NBEA A053RC1Q027SBEA
        https://nces.ed.gov/programs/digest/d24/tables/xls/tabn330.10.xlsx
        https://www.irs.gov/pub/irs-soi/histab23.xls
        https://www.census.gov/housing/hvs/data/histtab19.xlsx
