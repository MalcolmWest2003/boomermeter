# Metric registry. Every number on the site is defined here first.
# Required fields are checked by bm/registry.py; the pipeline refuses to run
# if a metric computed in code has no entry here, or an entry lacks a field.
#
# status_kind: what kind of number this usually is
#   measured      - read directly from a source release
#   interpolated  - estimated between/after source releases
#   projected     - forecast into the future

metrics:

  - id: boomer_headcount
    display_name: Living Baby Boomers (US)
    status_kind: interpolated
    source:
      name: U.S. Census Bureau, Population Estimates Program (PEP)
      api: www2.census.gov flat files
      endpoint: popest/datasets/2020-{vintage}/national/asrh/nc-est{vintage}-alldata-r-file*.csv
      series_id: NC-EST ALLDATA resident population, monthly, single year of age (TOT_POP)
    update_cadence: annual vintage (Census publishes monthly estimates plus short-term projections once a year)
    adjustment_pipeline:
      - boomer_cohort_from_single_year_ages
      - census_monthly_or_extrapolated
      - round_3_sig_figs
    known_confounds:
      - Immigration adds boomer-age people; emigration removes them. Census estimates include both; our own extrapolation after Census's last month carries forward the recent observed rate, which includes both.
      - Single-year-of-age bins do not align with birth years; see the cohort convention on the methods page.
    chart_type: line_with_band
    caveat_line: "Estimate. Census monthly figures; after Census's last month, extrapolated from the recent rate of decline."

  - id: boomer_share_gone
    display_name: Share of the peak Boomer population no longer living in the US
    status_kind: interpolated
    source:
      name: Derived — boomer_headcount ÷ peak living Boomer population
      api: n/a
      endpoint: n/a
      series_id: peak = 78.8 million (1999), U.S. Census Bureau report P25-1141
    update_cadence: daily recompute
    adjustment_pipeline:
      - one_minus_headcount_over_peak
    known_confounds:
      - Counts deaths and net emigration together; the meter measures presence in the US, not deaths alone.
      - The peak is a published Census figure; our headcount method matches its convention (ages on July 1).
    chart_type: meter
    caveat_line: "Estimate. 100% = the Boomer population at its 1999 peak (78.8M, Census)."

  - id: congress_median_age_house
    display_name: Median age, U.S. House (voting members)
    status_kind: measured
    source:
      name: unitedstates/congress-legislators
      api: GitHub raw files
      endpoint: legislators-current.yaml
      series_id: bio.birthday, terms[-1].type == rep
    update_cadence: continuous (recomputed daily)
    adjustment_pipeline: [exclude_nonvoting_delegates, exact_age_on_run_date, median]
    known_confounds:
      - Vacancies are simply absent; a vacant seat does not count toward the median.
    chart_type: stat
    caveat_line: "Exact ages from published birthdates. Excludes non-voting delegates."

  - id: congress_median_age_senate
    display_name: Median age, U.S. Senate
    status_kind: measured
    source:
      name: unitedstates/congress-legislators
      api: GitHub raw files
      endpoint: legislators-current.yaml
      series_id: bio.birthday, terms[-1].type == sen
    update_cadence: continuous (recomputed daily)
    adjustment_pipeline: [exact_age_on_run_date, median]
    known_confounds: []
    chart_type: stat
    caveat_line: "Exact ages from published birthdates."

  - id: congress_boomer_share
    display_name: Boomer share of Congress (House + Senate voting members)
    status_kind: measured
    source:
      name: unitedstates/congress-legislators
      api: GitHub raw files
      endpoint: legislators-current.yaml
      series_id: bio.birthday year in 1946..1964
    update_cadence: continuous (recomputed daily)
    adjustment_pipeline: [exclude_nonvoting_delegates, generation_by_birth_year, share_of_seated_members]
    known_confounds: []
    chart_type: stacked_bar
    caveat_line: "Share of seated voting members. Generation by birth year (Pew definitions)."

  - id: congress_median_age_history
    display_name: Median age of Congress, 1789 to today
    status_kind: measured
    source:
      name: unitedstates/congress-legislators
      api: GitHub raw files
      endpoint: legislators-historical.yaml + legislators-current.yaml
      series_id: members holding a seat one year after the start of each Congress
    update_cadence: continuous
    adjustment_pipeline: [exclude_nonvoting_delegates, members_serving_on_date, drop_missing_birthdates, median]
    known_confounds:
      - Some early members have no recorded birthdate; they are dropped and coverage is reported.
      - Territorial delegates are excluded using each state's admission date.
      - The source does not always shorten a term when a member died or resigned; where a districted seat shows two holders, the one whose term started later is kept.
    chart_type: line
    caveat_line: "Members seated one year into each Congress. Some pre-1850 birthdates missing; coverage shown."

  - id: wealth_share_networth
    display_name: Boomer-headed households' share of US household net worth
    status_kind: measured
    source:
      name: Federal Reserve Board, Distributional Financial Accounts (DFA)
      api: federalreserve.gov flat file
      endpoint: releases/z1/dataviz/download/zips/dfa.zip → dfa-generation-levels.csv
      series_id: Net worth by generation (levels); share computed as Boomer ÷ sum of generations
    update_cadence: quarterly (~11 weeks after quarter end)
    adjustment_pipeline: [share_from_levels]
    known_confounds:
      - Generation is that of the household's reference person; a Boomer-headed household counts wholly as Boomer.
      - DFA values are revised with each Financial Accounts release; revisions of published numbers are logged as corrections.
    chart_type: line
    caveat_line: "Fed DFA. Households assigned by the generation of the household head."

  - id: wealth_share_equities
    display_name: Boomer-headed households' share of corporate equities & mutual funds
    status_kind: measured
    source:
      name: Federal Reserve Board, Distributional Financial Accounts (DFA)
      api: federalreserve.gov flat file
      endpoint: dfa.zip → dfa-generation-levels.csv
      series_id: Corporate equities and mutual fund shares by generation
    update_cadence: quarterly
    adjustment_pipeline: [share_from_levels]
    known_confounds:
      - Excludes equities held through pension entitlements, which DFA reports separately.
      - Generation is that of the household's reference person.
    chart_type: line
    caveat_line: "Fed DFA. Directly held equities and mutual funds; pensions counted separately."

  - id: wealth_share_realestate
    display_name: Boomer-headed households' share of household real estate
    status_kind: measured
    source:
      name: Federal Reserve Board, Distributional Financial Accounts (DFA)
      api: federalreserve.gov flat file
      endpoint: dfa.zip → dfa-generation-levels.csv
      series_id: Real estate by generation (market value, not net of mortgages)
    update_cadence: quarterly
    adjustment_pipeline: [share_from_levels]
    known_confounds:
      - Gross market value; mortgages are not subtracted, so this is ownership of homes' value, not home equity.
      - Generation is that of the household's reference person.
    chart_type: line
    caveat_line: "Fed DFA. Market value of real estate, before mortgages."

  # ---- History: what each generation faced at the same age (bm/metrics/history.py)
  - id: hist_price_to_income
    display_name: "Median new-home price ÷ median family income"
    status_kind: measured
    source:
      name: "U.S. Census Bureau & HUD (MSPUS); U.S. Census Bureau CPS (MEFAINUSA646N), via FRED"
      api: fred.stlouisfed.org
      endpoint: "graph/fredgraph.csv?id=<series>"
      series_id: "MSPUS, MEFAINUSA646N"
    update_cadence: "annual (price quarterly, income annual)"
    adjustment_pipeline: [annual_mean_of_quarters, ratio]
    known_confounds:
      - "New-house prices exceed existing-house prices; the level is high but the change over time is comparable."
      - "Family income, not household income: the household series starts only in 1984."
    chart_type: line_with_generation_windows
    caveat_line: "Census price and income data. New houses only."

  - id: hist_mortgage_payment_share
    display_name: "Mortgage payment on the median new home, % of median family income"
    status_kind: measured
    source:
      name: "Freddie Mac PMMS (MORTGAGE30US); Census/HUD (MSPUS); Census CPS (MEFAINUSA646N), via FRED"
      api: fred.stlouisfed.org
      endpoint: "graph/fredgraph.csv?id=<series>"
      series_id: "MORTGAGE30US, MSPUS, MEFAINUSA646N"
    update_cadence: "annual"
    adjustment_pipeline: [annual_mean, fixed_rate_payment_20pct_down_30yr, ratio]
    known_confounds:
      - "Principal and interest only; property taxes and insurance excluded."
      - "Assumes 20% down; first-time buyers often put down less, which raises the share."
    chart_type: line_with_generation_windows
    caveat_line: "Computed: 30-year fixed, 20% down, at that year's average rate."

  - id: hist_mortgage_rate
    display_name: "30-year fixed mortgage rate, annual average"
    status_kind: measured
    source:
      name: "Freddie Mac Primary Mortgage Market Survey, via FRED"
      api: fred.stlouisfed.org
      endpoint: "graph/fredgraph.csv?id=<series>"
      series_id: "MORTGAGE30US"
    update_cadence: "weekly source, annual mean"
    adjustment_pipeline: [annual_mean]
    known_confounds:
      - "Survey rate for prime borrowers; many buyers paid more."
    chart_type: line_with_generation_windows
    caveat_line: "Freddie Mac survey rate."

  - id: hist_fed_funds
    display_name: "Effective federal funds rate, annual average"
    status_kind: measured
    source:
      name: "Board of Governors of the Federal Reserve System, via FRED"
      api: fred.stlouisfed.org
      endpoint: "graph/fredgraph.csv?id=<series>"
      series_id: "FEDFUNDS"
    update_cadence: "monthly source, annual mean"
    adjustment_pipeline: [annual_mean]
    known_confounds: []
    chart_type: line_with_generation_windows
    caveat_line: "Federal Reserve."

  - id: hist_productivity_index
    display_name: "Output per hour, nonfarm business (1948 = 100)"
    status_kind: measured
    source:
      name: "U.S. Bureau of Labor Statistics, via FRED"
      api: fred.stlouisfed.org
      endpoint: "graph/fredgraph.csv?id=<series>"
      series_id: "OPHNFB"
    update_cadence: "quarterly source, annual mean"
    adjustment_pipeline: [annual_mean, rebase_1948]
    known_confounds:
      - "Output deflator differs from consumer prices; see the pay-gap note."
    chart_type: line_with_generation_windows
    caveat_line: "BLS productivity."

  - id: hist_real_comp_index
    display_name: "Real hourly compensation, nonfarm business (1948 = 100)"
    status_kind: measured
    source:
      name: "U.S. Bureau of Labor Statistics, via FRED"
      api: fred.stlouisfed.org
      endpoint: "graph/fredgraph.csv?id=<series>"
      series_id: "COMPRNFB"
    update_cadence: "quarterly source, annual mean"
    adjustment_pipeline: [annual_mean, rebase_1948]
    known_confounds:
      - "Includes benefits and all earners including executives; smallest measured gap."
    chart_type: line_with_generation_windows
    caveat_line: "BLS, includes benefits and all earners."

  - id: hist_real_wage_index
    display_name: "Real average hourly earnings, production and nonsupervisory workers (spliced to 1948 = 100 scale at 1964)"
    status_kind: measured
    source:
      name: "U.S. Bureau of Labor Statistics (AHETPI); CPI-U (CPIAUCNS), via FRED"
      api: fred.stlouisfed.org
      endpoint: "graph/fredgraph.csv?id=<series>"
      series_id: "AHETPI, CPIAUCNS"
    update_cadence: "monthly source, annual mean"
    adjustment_pipeline: [annual_mean, deflate_cpi_u, splice_to_comp_index_1964]
    known_confounds:
      - "Wages only, no benefits; CPI-U deflator; largest measured gap."
    chart_type: line_with_generation_windows
    caveat_line: "BLS wages of non-supervisory workers, CPI-deflated."

  - id: hist_labor_share
    display_name: "Compensation of employees, % of gross domestic income"
    status_kind: measured
    source:
      name: "U.S. Bureau of Economic Analysis, via FRED"
      api: fred.stlouisfed.org
      endpoint: "graph/fredgraph.csv?id=<series>"
      series_id: "A4002E1A156NBEA"
    update_cadence: "annual"
    adjustment_pipeline: [as_published]
    known_confounds:
      - "Proprietors' income is partly labor income and is not included."
    chart_type: line_with_generation_windows
    caveat_line: "BEA national accounts."

  - id: hist_profit_share
    display_name: "Corporate profits after tax, % of GDP"
    status_kind: measured
    source:
      name: "U.S. Bureau of Economic Analysis, via FRED"
      api: fred.stlouisfed.org
      endpoint: "graph/fredgraph.csv?id=<series>"
      series_id: "CP, GDP"
    update_cadence: "quarterly source, annual mean"
    adjustment_pipeline: [annual_mean, ratio]
    known_confounds:
      - "Book profits without inventory and capital consumption adjustments."
    chart_type: line_with_generation_windows
    caveat_line: "BEA national accounts."

  - id: hist_real_min_wage
    display_name: "Federal minimum wage, latest-year dollars"
    status_kind: measured
    source:
      name: "U.S. Department of Labor (FEDMINNFRWG); CPI-U (CPIAUCNS), via FRED"
      api: fred.stlouisfed.org
      endpoint: "graph/fredgraph.csv?id=<series>"
      series_id: "FEDMINNFRWG, CPIAUCNS"
    update_cadence: "monthly source, annual mean"
    adjustment_pipeline: [annual_mean, deflate_cpi_u]
    known_confounds:
      - "Many states and cities set higher minimums."
    chart_type: line_with_generation_windows
    caveat_line: "Federal floor, CPI-deflated."

  - id: hist_tuition_hours_min_wage
    display_name: "Hours at the federal minimum wage to pay one year of public 4-year in-state tuition and fees"
    status_kind: measured
    source:
      name: "NCES Digest of Education Statistics table 330.10; U.S. Department of Labor (FEDMINNFRWG)"
      api: nces.ed.gov
      endpoint: "digest/d{yy}/tables/xls/tabn330.10.xlsx; fredgraph.csv"
      series_id: "tabn330.10 public 4-year tuition and required fees; FEDMINNFRWG"
    update_cadence: "annual"
    adjustment_pipeline: [ratio]
    known_confounds:
      - "Sticker price before grants and aid."
      - "Federal minimum; many states set higher minimums."
    chart_type: line_with_generation_windows
    caveat_line: "Sticker tuition over the federal minimum wage."

  - id: hist_tuition_real
    display_name: "Public 4-year in-state tuition and fees, latest-year dollars"
    status_kind: measured
    source:
      name: "NCES Digest of Education Statistics table 330.10; CPI-U (CPIAUCNS)"
      api: nces.ed.gov
      endpoint: "digest/d{yy}/tables/xls/tabn330.10.xlsx; fredgraph.csv"
      series_id: "tabn330.10 public 4-year tuition and required fees"
    update_cadence: "annual"
    adjustment_pipeline: [deflate_cpi_u]
    known_confounds:
      - "Sticker price before grants and aid."
    chart_type: line_with_generation_windows
    caveat_line: "NCES sticker price, CPI-deflated."

  - id: hist_corp_effective_tax
    display_name: "Federal taxes on corporate income, % of corporate profits before tax"
    status_kind: measured
    source:
      name: "U.S. Bureau of Economic Analysis, via FRED"
      api: fred.stlouisfed.org
      endpoint: "graph/fredgraph.csv?id=<series>"
      series_id: "B075RC1Q027SBEA, A053RC1Q027SBEA"
    update_cadence: "quarterly source, annual mean"
    adjustment_pipeline: [annual_mean, ratio]
    known_confounds:
      - "Book profits, not taxable income; aggregate across all corporations."
      - "Excludes state corporate taxes."
    chart_type: line_with_generation_windows
    caveat_line: "BEA aggregate effective rate."

  - id: hist_top_income_tax_rate
    display_name: "Top federal income tax bracket rate"
    status_kind: measured
    source:
      name: "IRS Statistics of Income, historical table 23; statute for years after the table ends"
      api: irs.gov
      endpoint: "pub/irs-soi/histab23.xls"
      series_id: "histab23.xls highest bracket rate; 37% from P.L. 115-97 / P.L. 119-21 after 2018"
    update_cadence: "annual"
    adjustment_pipeline: [as_published, statutory_carry_forward_after_table]
    known_confounds:
      - "Statutory rate on the top bracket; effective rates at the top are lower."
    chart_type: line_with_generation_windows
    caveat_line: "IRS SOI table 23."

landmarks:

  - id: lm_wealth_under_half
    display_name: Boomers hold under half of US household wealth
    metric: wealth_share_networth
    threshold: 50.0
    direction: below
    method: Linear trend of the quarterly share, fitted over several recent windows (3 to 7 years). Central = 5-year window; range = earliest and latest crossing across windows.
    caveat_line: "Projection from recent trend. Market swings move this date by years."

  - id: lm_congress_under_third
    display_name: Boomers hold under a third of Congress
    metric: congress_boomer_share
    threshold: 33.3
    direction: below
    method: Linear trend of the Boomer share measured at the start of each Congress since the share peaked, plus today. Central = last 5 points; range = earliest and latest crossing across windows of 3 to 6 points.
    caveat_line: "Projection from recent Congresses. Elections move in steps; this is a trend line, not a forecast of any race."

  - id: lm_cohort_half_gone
    display_name: Half of the peak Boomer population gone
    metric: boomer_share_gone
    threshold: 50.0
    direction: above
    method: Census 2023 National Population Projections by single year of age, scaled so 2025 matches the latest estimate. Range = low- and high-immigration projection series.
    caveat_line: "Census projection. The range covers immigration scenarios only, not mortality surprises."
